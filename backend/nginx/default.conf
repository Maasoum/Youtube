# ترمینیشن TLS در این فایل انجام نمی‌شود؛ در محیط واقعی گواهی را روی
# همین لایه یا یک load balancer جلوی آن قرار دهید.

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

upstream brightpaths_api {
    server api:3000;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    client_max_body_size 1m;
    client_body_timeout 15s;
    send_timeout 30s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # پاسخ‌های API قابل کش‌شدن نیستند.
    add_header Cache-Control "no-store" always;

    location = /healthz {
        proxy_pass http://brightpaths_api/healthz;
        access_log off;
    }

    location = /readyz {
        proxy_pass http://brightpaths_api/readyz;
        access_log off;
    }

    location / {
        limit_req zone=api_limit burst=40 nodelay;

        proxy_pass http://brightpaths_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # پاسخ‌های API کش نمی‌شوند (هدر در سطح server تنظیم شده است).
        proxy_buffering off;
    }
}
