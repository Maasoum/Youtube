# هدرهای امنیتی مشترک؛ در هر location ای که add_header دارد هم include شود،
# چون در nginx تعریف add_header در location، هدرهای سطح بالاتر را لغو می‌کند.
#
# CSP سخت‌گیرانه است چون همه‌ی دارایی‌ها (فونت، تصویر، اسکریپت، استایل) از
# همین دامنه سرو می‌شوند. `style-src 'unsafe-inline'` فقط برای style attribute
#های React لازم است؛ هیچ stylesheet یا اسکریپت بیرونی مجاز نیست.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
