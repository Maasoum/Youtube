# ---------------------------------------------------------------------------
# nginx برای «مسیرهای روشن»: سرو SPA + پروکسی API
#
# این فایل را در /etc/nginx/conf.d/brightpaths.conf بگذارید و snippet را در
# /etc/nginx/snippets/security-headers.conf. مسیر ریشه‌ی build را تنظیم کنید.
#
#   npm run build
#   rsync -a --delete dist/ /var/www/brightpaths/
#   nginx -t && systemctl reload nginx
# ---------------------------------------------------------------------------

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

upstream brightpaths_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /var/www/brightpaths;
    index index.html;

    charset utf-8;
    client_max_body_size 2m;
    client_body_timeout 15s;
    send_timeout 30s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    include /etc/nginx/snippets/security-headers.conf;

    # API: فقط از همین مبدأ؛ کوکی نشست با SameSite=Lax کار می‌کند.
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;

        proxy_pass http://brightpaths_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering off;

        include /etc/nginx/snippets/security-headers.conf;

        # پاسخ‌های API هرگز کش نمی‌شوند.
        add_header Cache-Control "no-store" always;
    }

    # فایل‌های بارگذاری‌شده (در صورت فعال‌شدن در آینده) از خود API سرو می‌شوند.
    location /uploads/ {
        proxy_pass http://brightpaths_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
    }

    # دارایی‌های hash‌دار Vite: کش یک‌ساله و تغییرناپذیر.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # فونت‌های self-host با نام ثابت؛ کش طولانی اما نه immutable.
    location /fonts/ {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000";
    }

    # index.html هرگز کش نمی‌شود تا نسخه‌ی تازه‌ی اپلود بلافاصله دیده شود.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # مسیرهای SPA (react-router) با fallback به index.html.
    # هر چیز غیر از /assets و /fonts بدون کش می‌ماند تا نسخه‌ی تازه فوراً دیده شود.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}

